<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>コンテンツ管理 | KAZU WORKS</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <!-- 設定ファイルは同じフォルダから読み込みます（公開場所が変わっても動くように相対指定） -->
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      body {
        margin: 0;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        background: #fbfaf8;
      }
      #loading {
        display: grid;
        place-items: center;
        min-height: 100vh;
        gap: 1rem;
        text-align: center;
        color: #5a6478;
        padding: 2rem;
      }
      #loading strong {
        display: block;
        font-size: 1.125rem;
        color: #1d2430;
        margin-bottom: 0.5rem;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(47, 125, 225, 0.25);
        border-top-color: #2f7de1;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
      .hint {
        font-size: 0.8125rem;
        line-height: 1.9;
        max-width: 34em;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>
        <strong>管理画面を読み込んでいます</strong>
        <span class="hint">
          しばらく待っても表示されない場合は、ページを再読み込みしてください。
          パソコンから編集するときは、ターミナルで <code>npm run cms</code> を実行してから
          このページを開きます。
        </span>
      </p>
    </div>

    <script src="sveltia-cms.js" onerror="window.__cmsFailed = true"></script>
    <script>
      (function () {
        const loading = document.getElementById('loading');
        if (!loading) return;

        // 管理画面が描画されたら、読み込み表示を消す
        const observer = new MutationObserver(() => {
          if (document.querySelector('.app-shell')) {
            loading.remove();
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true });

        // 本体を読み込めなかったときは、原因が分かる案内を出す
        setTimeout(() => {
          if (!document.querySelector('.app-shell')) {
            observer.disconnect();
            loading.innerHTML =
              '<p><strong>管理画面を読み込めませんでした</strong>' +
              '<span class="hint">ページを再読み込みしても表示されない場合は、' +
              'ターミナルで <code>npm install</code> を実行してから ' +
              '<code>npm run cms</code> をお試しください。</span></p>';
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
