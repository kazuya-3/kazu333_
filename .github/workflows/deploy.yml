name: Deploy to GitHub Pages

# Settings → Pages → Build and deployment → Source を「GitHub Actions」にすると有効になります。
# SITE_URL / BASE_PATH を変えたい場合は、リポジトリの
# Settings → Secrets and variables → Actions → Variables に登録してください。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。進行中のものはキャンセルしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
          PUBLIC_CONTACT_PROVIDER: ${{ vars.PUBLIC_CONTACT_PROVIDER }}
          PUBLIC_FORMSPREE_ENDPOINT: ${{ vars.PUBLIC_FORMSPREE_ENDPOINT }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_TIP_URL_300: ${{ vars.PUBLIC_TIP_URL_300 }}
          PUBLIC_TIP_URL_500: ${{ vars.PUBLIC_TIP_URL_500 }}
          PUBLIC_TIP_URL_1000: ${{ vars.PUBLIC_TIP_URL_1000 }}
          PUBLIC_TIP_URL_CUSTOM: ${{ vars.PUBLIC_TIP_URL_CUSTOM }}
          PUBLIC_ANALYTICS_ID: ${{ vars.PUBLIC_ANALYTICS_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
